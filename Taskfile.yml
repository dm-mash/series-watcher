version: '3'

vars:
  USER:
    sh: 'echo "${USER:-$(id -un)}"'
  PROJECT_DIR:
    sh: 'pwd'

tasks:
  venv:
    desc: Create .venv and install the package
    cmds:
      - |
        if ! python3 -c 'import venv' 2>/dev/null; then
          echo "Требуется модуль venv: sudo apt install python3-venv (или python3.x-venv)" >&2
          exit 1
        fi
      - |
        if [ ! -x .venv/bin/python ]; then
          rm -rf .venv
          python3 -m venv .venv
        fi
      - |
        if [ ! -x .venv/bin/pip ]; then
          .venv/bin/python -m ensurepip --upgrade
        fi
      - .venv/bin/python -m pip install --upgrade pip
      - .venv/bin/python -m pip install -e .

  render:
    desc: Render systemd unit templates into deploy/rendered/
    cmds:
      - mkdir -p deploy/rendered
      - |
        for f in deploy/*.service deploy/*.timer; do
          [ -e "$f" ] || continue
          env USER="{{.USER}}" PROJECT_DIR="{{.PROJECT_DIR}}" \
            envsubst '$$USER $$PROJECT_DIR' < "$f" > "deploy/rendered/$(basename "$f")"
        done

  install:
    desc: Create venv, render and install units into /etc/systemd/system
    deps: [venv, render]
    cmds:
      - sudo cp deploy/rendered/* /etc/systemd/system/
      - sudo systemctl daemon-reload

  enable:
    desc: Enable and start the timers and the bot
    cmds:
      - sudo systemctl enable --now series-watcher.timer series-watcher-weekly.timer series-watcher-bot.service

  test:
    desc: Run the test suite
    cmds:
      - .venv/bin/python -m pytest -q
