[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "series-watcher"
version = "0.1.0"
description = "Трекер выхода сериалов: расписание, уведомления в Telegram, где смотреть"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
series-watcher = "series_watcher.cli:main"

[tool.setuptools.packages.find]
include = ["series_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]